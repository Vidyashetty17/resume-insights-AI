<!DOCTYPE html>
<html>

<head>

<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">

</head>

<body>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card p-4">

<h2 class="text-center mb-4">Create Account</h2>

<form method="POST">

<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<input class="form-control mb-3" name="name" placeholder="Full Name">

<input class="form-control mb-3" name="email" placeholder="Email">

<input class="form-control mb-3" type="password" name="password" placeholder="Password">

<input class="form-control mb-3" type="password" name="confirm_password" placeholder="Confirm Password">

<button class="btn btn-custom w-100">

Register

</button>

</form>

</div>

</div>

</div>

</div>

</body>

</html>
